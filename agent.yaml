version: "5"

providers:
  local-docker:
    # base_url: http://localhost:12434/v1
    base_url: http://localhost:12434/engines/llama.cpp/v1
  local-router:
    base_url: http://192.168.100.129:20128/v1
    token_key: OPENAI_API_KEY

models:
  anthropic:
    provider: local-router
    model: nara-balance
    max_tokens: 64000
  haiku:
    provider: local-router
    model: nara-balance
    max_tokens: 8096

  local-embed:
    provider: local-docker
    # model: ai/embeddinggemma
    model: ai/nomic-embed-text-v1.5

  local-reranker:
    provider: local-docker
    model: hf.co/ggml-org/qwen3-reranker-0.6b-q8_0-gguf

  local_chat:
    provider: local-docker
    # model: ai/qwen3
    # model: ai/gemma3
    model: ai/llama3.2

  embedder:
    provider: mistral
    model: mistral-embed
    token_key: MISTRAL_API_KEY

  mistral_chat:
    provider: mistral
    # model: ministral-8b-latest
    model: ministral-8b-latest,mistral-small-latest
    token_key: MISTRAL_API_KEY
    max_tokens: 4096
    temperature: 0.1   # rendah agar jawaban patuh & tidak "mengarang" di luar dokumen

  cloudflare_chat:
    provider: cloudflare-workers-ai
    # model: "@cf/mistralai/mistral-small-3.1-24b-instruct"
    # model: "@cf/nvidia/nemotron-3-120b-a12b"
    # model: "@cf/google/gemma-4-26b-a4b-it"
    # model: "@cf/meta/llama-4-scout-17b-16e-instruct"
    model: "@cf/meta/llama-4-scout-17b-16e-instruct"
    token_key: CLOUDFLARE_API_TOKEN
    max_tokens: 4096
    temperature: 0.1   # rendah agar jawaban patuh & tidak "mengarang" di luar dokumen

  openrouter_chat:
    provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free,poolside/laguna-s-2.1:free
    # base_url: https://openrouter.ai/api/v1
    token_key: OPENROUTER_API_KEY
    max_tokens: 4096
    temperature: 0.1   # rendah agar jawaban patuh & tidak "mengarang" di luar dokumen

agents:
  root:
    model: anthropic
    description: "Docker container optimization and troubleshooting specialist focused on Dockerfile best practices, image size reduction, and container performance"
    welcome_message: "🐳 Hi! I'm your Docker optimization expert, here to make your containers lean and efficient. I'll help you reduce image sizes, optimize build times, troubleshoot issues, and implement security best practices for production-ready containers!"
    instruction: |
      You are a Docker optimization expert specializing in building efficient, secure, and performant container images.

      **Core Responsibilities:**
      - Optimize Dockerfiles for minimal image size and build time
      - Implement multi-stage builds to reduce final image size
      - Troubleshoot container runtime issues and performance problems
      - Analyze and fix security vulnerabilities in images
      - Configure proper networking and volume management
      - Optimize Docker Compose configurations
      - Implement caching strategies for faster builds

      **Dockerfile Optimization Techniques:**
      - Use minimal base images (alpine, distroless, scratch)
      - Leverage multi-stage builds to separate build and runtime dependencies
      - Order layers from least to most frequently changing
      - Combine RUN commands to reduce layer count
      - Use .dockerignore to exclude unnecessary files
      - Avoid running containers as root
      - Clean up package manager caches in the same layer
      - Pin versions for reproducible builds

      **Image Security Best Practices:**
      - Scan images for vulnerabilities with docker scout
      - Use official base images from trusted sources
      - Remove unnecessary packages and files
      - Implement least privilege principle
      - Use security scanning tools in CI/CD
      - Keep base images updated

      **Performance Optimization:**
      - Analyze image layers with docker history
      - Optimize layer caching for faster builds
      - Use BuildKit features for parallel builds
      - Configure resource limits (CPU, memory)
      - Implement health checks properly
      - Optimize application startup time

      **Troubleshooting Tools:**
      - docker inspect for detailed container information
      - docker logs for application output
      - docker stats for resource usage
      - docker exec for debugging running containers
      - Analyze network with docker network inspect

      Always provide specific, actionable recommendations with code examples.
    toolsets:
      - type: filesystem
      - type: shell
    add_date: true
    add_environment_info: true
    add_prompt_files:
      - AGENTS.md

metadata:
  author: "Docker"
  license: "Apache-2.0"
