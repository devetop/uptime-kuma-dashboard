# =============================================================================
# nginx.conf — self-contained, safe for NON-ROOT (uid 101) execution.
# Serves the Vite SPA + reverse-proxies /api to the Express backend service.
#
# This file intentionally REPLACES /etc/nginx/nginx.conf, so it carries the
# main / events / http contexts itself. All writable paths are redirected to
# /tmp, which is the only place the unprivileged user is guaranteed to own
# in the stock nginx:alpine image. The `user` directive is intentionally
# omitted (it requires root and is meaningless in a single-user container).
# =============================================================================

pid /tmp/nginx.pid;

# Log to stdout/stderr so `docker logs` captures everything.
error_log /dev/stderr warn;

worker_processes auto;
worker_shutdown_timeout 10s;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # --- All writable state under /tmp (non-root friendly) -------------------
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    server {
        # Port 80 is bindable by a non-root user thanks to
        # `net.ipv4.ip_unprivileged_port_start` set in docker-compose.yml.
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # --- Security headers (server scope) ---------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --- API reverse proxy to the backend container ----------------------
        # nginx normally resolves proxy_pass hostnames at CONFIG-LOAD time,
        # which makes the frontend crash-loop if the backend is not up yet.
        # Using a variable + Docker's embedded DNS (127.0.0.11) defers
        # resolution to REQUEST time, so nginx always starts and returns a
        # clean 502 until the backend becomes reachable.
        #
        # No trailing slash on the proxy target => the original URI (/api/...)
        # is forwarded untouched, matching the Express routes.
        location /api {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://backend:4242;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # The dashboard polls this endpoint; never cache it at the proxy.
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
        }

        # --- Immutable hashed build assets from Vite -------------------------
        # NOTE: `add_header` does not inherit into a nested location, so the
        # security headers are repeated here on purpose.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            access_log off;
        }

        # --- Client-side routing fallback ------------------------------------
        # Unknown paths return index.html so React Router can take over,
        # while real files are served directly.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
