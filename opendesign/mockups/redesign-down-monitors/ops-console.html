<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B — Ops Console</title>
<link rel="stylesheet" href="../../design-systems/monitoring-dashboard/tokens/colors_and_type.css" />
<style>
  /* Direction B: information-architecture change. The list becomes the whole app;
     a left rail owns counts, category filters, and severity sorting. On narrow
     screens the rail collapses to a horizontal chip band above the list — the
     same content, re-flowed, no drawer. */
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font-sans); background: var(--surface-page); color: var(--fg-strong);
         transition: background-color var(--duration-color) var(--ease-color); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  :where(button, input, a, [tabindex]):focus-visible { outline: var(--ring) solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-md); }
  li:focus-visible { outline-offset: -2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

  header { position: sticky; top: 0; z-index: 10; background: var(--surface-panel); border-bottom: 1px solid var(--border-subtle); }
  .hrow { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4); }
  h1 { font-size: var(--text-sm); line-height: var(--leading-sm); font-weight: var(--weight-semibold); }
  .live { font-size: var(--text-xs); color: var(--fg-meta); }
  .hbtns { margin-left: auto; display: flex; gap: var(--space-2); }
  .btn { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 2.75rem; border-radius: var(--radius-md);
         padding: 0 var(--space-3); font-size: var(--text-xs); line-height: var(--leading-xs); font-family: inherit; cursor: pointer;
         transition: background-color var(--duration-color) var(--ease-color); border: 1px solid transparent; }
  .btn-primary { background: var(--accent); color: var(--fg-on-accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-icon { width: 2.75rem; padding: 0; justify-content: center; border-color: var(--border-strong); background: transparent; color: var(--fg-muted); }
  .btn-icon:hover { background: var(--surface-row-hover); }

  .console { display: grid; grid-template-columns: 15rem 1fr; gap: var(--space-4); max-width: 80rem; margin: 0 auto; padding: var(--space-4); }
  @media (width < 45rem) { .console { grid-template-columns: 1fr; } .rail { position: static; } .rail-list { display: flex; overflow-x: auto; gap: var(--space-2); padding-bottom: var(--space-1); } .rail hr { display: none; } .rail .count-big { display: none; } }

  .rail { position: sticky; top: 3.25rem; align-self: start; display: flex; flex-direction: column; gap: var(--space-3); }
  .count-big { display: flex; align-items: baseline; gap: var(--space-2); }
  .count-big b { font-size: 2rem; line-height: 1; font-weight: var(--weight-semibold); color: var(--count-alarm-fg); }
  .count-big span { font-size: var(--text-xs); line-height: var(--leading-xs); color: var(--fg-muted); }
  .rail hr { border: 0; border-top: 1px solid var(--border-subtle); }
  .rail h2 { font-size: var(--text-xs); line-height: var(--leading-xs); font-weight: var(--weight-semibold); color: var(--fg-meta); }
  .cat { display: flex; align-items: center; gap: var(--space-2); width: 100%; text-align: left; border: 1px solid transparent;
         background: transparent; border-radius: var(--radius-md); min-height: 2.75rem; padding: 0 var(--space-2); cursor: pointer;
         font-family: inherit; font-size: var(--text-xs); line-height: var(--leading-xs); color: var(--fg-muted);
         transition: background-color var(--duration-color) var(--ease-color); }
  .cat:hover { background: var(--surface-row-hover); }
  .cat[aria-pressed="true"] { border-color: var(--border-strong); background: var(--surface-panel); color: var(--fg-strong); }
  .cat .n { margin-left: auto; color: var(--fg-meta); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .list { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
  .toolbar { display: flex; gap: var(--space-2); }
  input[type="search"] { flex: 1; min-height: 2.75rem; border-radius: var(--radius-md); border: 1px solid var(--border-strong);
    background: var(--surface-panel); color: var(--fg-strong); padding: 0 var(--space-3); font-size: var(--text-sm); font-family: inherit;
    transition: border-color var(--duration-color) var(--ease-color); }
  input[type="search"]:focus-visible { border-color: var(--accent); }

  ul.records { list-style: none; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .record { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-3); align-items: center;
            background: var(--surface-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
            padding: var(--space-3); cursor: default; transition: background-color var(--duration-color) var(--ease-color); }
  .record:hover { background: var(--surface-row-hover); }
  .record .time { font-size: var(--text-sm); line-height: var(--leading-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); width: 9rem; }
  .record .time small { display: block; font-weight: 400; font-size: var(--text-xs); line-height: var(--leading-xs); color: var(--fg-meta); }
  .record .who { min-width: 0; }
  .record .who b { display: block; font-size: var(--text-sm); line-height: var(--leading-sm); font-weight: var(--weight-semibold); overflow-wrap: break-word; }
  .record .who code { display: block; font-size: var(--text-xs); line-height: var(--leading-xs); color: var(--fg-muted); overflow-wrap: break-word; margin-top: var(--space-1); }
  .record .end { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-1); }
  .endmeta { font-size: var(--text-xs); line-height: var(--leading-xs); color: var(--fg-meta); }
  .badge { display: inline-flex; align-items: center; border-radius: var(--radius-md); border: 1px solid;
           padding: var(--space-1) var(--space-2); font-size: var(--text-xs); line-height: var(--leading-xs); font-weight: var(--weight-semibold); }

  .skel { animation: pulse 2s ease-in-out infinite; border-radius: var(--radius-md); background: var(--surface-skeleton); }
  @keyframes pulse { 50% { opacity: .5; } }
  .banner { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); border-radius: var(--radius-md);
    border: 1px solid var(--alarm); background: var(--alarm-bg); color: var(--alarm-fg); padding: var(--space-3);
    font-size: var(--text-sm); line-height: var(--leading-sm); }
  .empty { background: var(--surface-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
    padding: var(--space-6); text-align: center; color: var(--fg-muted); font-size: var(--text-sm); }

  .clearlink { background: none; border: 0; font: inherit; font-weight: var(--weight-semibold); color: var(--accent-text);
               text-decoration: underline; text-underline-offset: 2px; cursor: pointer; padding: 0 var(--space-1); }
  .clearlink:hover { color: var(--accent-text-hover); }

  .simbar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; font-size: var(--text-xs);
            color: var(--fg-meta); max-width: 80rem; margin: 0 auto; padding: 0 var(--space-4) var(--space-6); }
  .simbar button { font: inherit; border: 1px solid var(--border-strong); background: var(--surface-panel);
    color: var(--fg-muted); border-radius: var(--radius-md); padding: var(--space-1) var(--space-2); cursor: pointer; }
  .simbar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-text); }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>Down Monitors</h1>
    <span class="live mono" id="live">Updated 16:05 · auto-refresh 30s</span>
    <div class="hbtns">
      <button class="btn btn-primary" id="refreshBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        Refresh
      </button>
      <button class="btn btn-icon" id="themeToggle" aria-pressed="false" aria-label="Switch to dark mode">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden id="themeIcon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="console">
  <aside class="rail" aria-label="Filters and summary">
    <div class="count-big"><b class="mono" id="countBig">7</b><span>monitors<br>down</span></div>
    <hr />
    <h2>Error type</h2>
    <div class="rail-list" id="railList" role="group" aria-label="Filter by error type"></div>
  </aside>

  <div class="list">
    <div id="bannerSlot"></div>
    <div class="toolbar">
      <input type="search" id="filter" placeholder="Filter by name or error message…" aria-label="Filter by monitor name or error message" autocomplete="off" />
    </div>
    <p class="sr-only" aria-live="polite" id="liveRegion"></p>
    <ul class="records" id="records"></ul>
    <div class="empty" id="empty" hidden>No down monitors match. <button class="clearlink" onclick="document.getElementById('filter').value='';active.clear();rail.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));draw()">Clear filters</button></div>
  </div>
</div>

<footer class="simbar">
  <span>Preview:</span>
  <button data-state="populated" aria-pressed="true">populated</button>
  <button data-state="loading" aria-pressed="false">loading</button>
  <button data-state="empty" aria-pressed="false">filtered-empty</button>
  <button data-state="error" aria-pressed="false">error</button>
  <span>— rail collapses to a chip band under 45rem.</span>
</footer>

<script>
  const CATS = {
    refused:     { label: 'ECONNREFUSED', n: 0 },
    unreachable: { label: 'EHOSTUNREACH', n: 0 },
    timeout:     { label: 'TIMEOUT', n: 0 },
    dns:         { label: 'ENOTFOUND', n: 0 },
    tls:         { label: 'TLS', n: 0 },
    http5xx:     { label: 'HTTP 5xx', n: 0 },
    http4xx:     { label: 'HTTP 4xx', n: 0 },
  };
  const ROWS = [
    { name: 'api-orders',       id: 12, dur: '3 minutes ago',  abs: '16:02:11', ping: '0.00 ms',    msg: 'connect ECONNREFUSED 10.4.1.22:3000',   cat: 'refused' },
    { name: 'search-index',     id: 29, dur: '28 minutes ago', abs: '15:37:02', ping: '96.31 ms',   msg: 'HTTP status code 429: rate limited',    cat: 'http4xx' },
    { name: 'payments-webhook', id: 4,  dur: '42 minutes ago', abs: '15:23:40', ping: '0.00 ms',    msg: 'connect ECONNREFUSED 10.4.1.31:8443',   cat: 'refused' },
    { name: 'grafana-public',   id: 18, dur: '2 hours ago',    abs: '14:35:23', ping: '145.20 ms',  msg: 'connect EHOSTUNREACH 10.0.0.9:3000',    cat: 'unreachable' },
    { name: 'auth-grpc',        id: 7,  dur: '5 hours ago',    abs: '11:04:55', ping: '812.44 ms',  msg: 'CERT_HAS_EXPIRED',                      cat: 'tls' },
    { name: 'checkout',         id: 2,  dur: '1 day ago',      abs: '13:04:18', ping: '30000.00 ms',msg: 'timeout of 30000ms exceeded',           cat: 'timeout' },
    { name: 'cdn-edge',         id: 22, dur: '2 days ago',     abs: '16:05:00', ping: '0.00 ms',    msg: 'getaddrinfo ENOTFOUND cdn.internal',    cat: 'dns' },
  ];
  ROWS.forEach(r => CATS[r.cat].n++);

  const active = new Set();
  const rail = document.getElementById('railList');
  for (const c of Object.keys(CATS)) {
    const b = document.createElement('button');
    b.className = 'cat'; b.setAttribute('aria-pressed', 'false'); b.dataset.cat = c;
    b.innerHTML = `<span class="dot" style="background:var(--badge-${c}-border)"></span>${CATS[c].label}<span class="n mono">${CATS[c].n}</span>`;
    b.onclick = () => { active.has(c) ? active.delete(c) : active.add(c); b.setAttribute('aria-pressed', String(active.has(c))); draw(); };
    rail.appendChild(b);
  }

  const records = document.getElementById('records');
  function filtered() {
    const q = document.getElementById('filter').value.trim().toLowerCase();
    return ROWS.filter(r => (!q || r.name.toLowerCase().includes(q) || r.msg.toLowerCase().includes(q)) && (!active.size || active.has(r.cat)));
  }
  function draw() {
    const rows = filtered();
    records.innerHTML = rows.map(r => `
      <li class="record" tabindex="0">
        <span class="time mono">${r.dur}<small>${r.abs}</small></span>
        <span class="who"><b>${r.name}</b><code class="mono">${r.msg}</code></span>
        <span class="end">
          <span class="badge mono" style="background:var(--badge-${r.cat}-bg);color:var(--badge-${r.cat}-fg);border-color:var(--badge-${r.cat}-border)">${CATS[r.cat].label}</span>
          <span class="mono endmeta">${r.ping} · ID #${r.id}</span>
        </span>
      </li>`).join('');
    document.getElementById('empty').hidden = rows.length !== 0;
    document.getElementById('countBig').textContent = rows.length;
    document.getElementById('liveRegion').textContent = `${rows.length} of ${ROWS.length} down monitors shown`;
  }
  document.getElementById('filter').addEventListener('input', draw);
  draw();

  const saved = records.innerHTML;
  const skel = `<li class="record"><span class="skel" style="height:32px;width:8.5rem"></span><span class="skel" style="height:32px"></span><span class="skel" style="height:32px;width:6rem"></span></li>`.repeat(4);
  const banner = `<div class="banner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span style="font-weight:600">Could not load monitors</span><span style="flex-grow:1;min-width:0">ETIMEDOUT connecting to API after 10000ms</span><button class="btn" style="border-color:var(--alarm);color:var(--alarm-fg)">Retry now</button></div>`;
  document.querySelectorAll('.simbar button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.simbar button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    const s = b.dataset.state;
    document.getElementById('bannerSlot').innerHTML = s === 'error' ? banner : '';
    document.getElementById('live').textContent = s === 'loading' ? 'Refreshing…' : 'Updated 16:05 · auto-refresh 30s';
    if (s === 'loading') records.innerHTML = skel;
    else if (s === 'empty') { document.getElementById('filter').value = 'zzz'; draw(); }
    else { document.getElementById('filter').value = ''; active.clear(); rail.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false')); draw(); }
  });

  const toggle = document.getElementById('themeToggle'), icon = document.getElementById('themeIcon');
  const MOON = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
  const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>';
  const paint = d => { document.documentElement.classList.toggle('dark', d); toggle.setAttribute('aria-pressed', d); toggle.setAttribute('aria-label', `Switch to ${d ? 'light' : 'dark'} mode`); icon.innerHTML = d ? SUN : MOON; };
  const st = localStorage.getItem('theme');
  paint(st === 'dark' || (st !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches));
  toggle.onclick = () => { const n = !document.documentElement.classList.contains('dark'); localStorage.setItem('theme', n ? 'dark' : 'light'); paint(n); };
</script>
</body>
</html>
